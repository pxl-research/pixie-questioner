[project]
name = "pixie-questioner"
version = "0.1.0"
description = "Multi-case chat API for guided intake and wine recommendations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "langchain-core>=1.2.10,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langdetect>=1.0.9",
  "defusedxml>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
  "black>=26.3.1,<27.0",
  "pytest>=9.0,<10.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pixie_questioner*"]
exclude = ["infra"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

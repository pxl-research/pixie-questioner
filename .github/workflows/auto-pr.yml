name: auto-pr
on:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'bug/**'
      - 'refactor/**'
      - 'chore/**'
      - 'test/**'
permissions:
  contents: read
  pull-requests: write
jobs:
  ensure-pr:
    runs-on: ubuntu-latest
    env:
      PROJECT_V2_ID: ${{ vars.PROJECT_V2_ID || 'PVT_kwDOB2OsP84BRN75' }}
      PROJECT_FIELD_STATUS_ID: ${{ vars.PROJECT_FIELD_STATUS_ID || 'PVTSSF_lADOB2OsP84BRN75zg_HBVU' }}
      PROJECT_STATUS_OPTION_REVIEW_ID: ${{ vars.PROJECT_STATUS_OPTION_REVIEW_ID || '883cdec6' }}
      PROJECT_FIELD_WORK_TYPE_ID: ${{ vars.PROJECT_FIELD_WORK_TYPE_ID || 'PVTSSF_lADOB2OsP84BRN75zg_HEFM' }}
      PROJECT_WORK_TYPE_OPTION_BUG_ID: ${{ vars.PROJECT_WORK_TYPE_OPTION_BUG_ID || '29b7e082' }}
      PROJECT_WORK_TYPE_OPTION_FEATURE_ID: ${{ vars.PROJECT_WORK_TYPE_OPTION_FEATURE_ID || '3e6662c5' }}
      PROJECT_WORK_TYPE_OPTION_REFACTOR_ID: ${{ vars.PROJECT_WORK_TYPE_OPTION_REFACTOR_ID || 'a60aa747' }}
      PROJECT_WORK_TYPE_OPTION_CHORE_ID: ${{ vars.PROJECT_WORK_TYPE_OPTION_CHORE_ID || '748f009e' }}
      PROJECT_FIELD_SHIPPED_ID: ${{ vars.PROJECT_FIELD_SHIPPED_ID || 'PVTSSF_lADOB2OsP84BRN75zg_HET4' }}
      PROJECT_SHIPPED_OPTION_NO_ID: ${{ vars.PROJECT_SHIPPED_OPTION_NO_ID || 'ef0a02b7' }}
    steps:
      - name: Ensure PR exists and add to project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/','');
            const match = branch.match(/^(feat|feature|fix|bug|refactor|chore|test)\/(?:(\d+)-)?(.+)$/);
            if (!match) {
              core.warning(`Branch ${branch} does not match expected pattern`);
              return;
            }
            const [, rawType, issue, slug] = match;
            const type = rawType === 'feat' ? 'feature' : rawType;

            function isAlreadyInProjectError(err) {
              const message = err instanceof Error ? err.message : String(err);
              return message.includes('already exists in this project');
            }

            async function findProjectItemId(projectId, contentId) {
              let cursor = null;

              while (true) {
                const response = await github.graphql(
                  `query($projectId: ID!, $cursor: String) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        items(first: 100, after: $cursor) {
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                          nodes {
                            id
                            content {
                              __typename
                              ... on PullRequest {
                                id
                              }
                            }
                          }
                        }
                      }
                    }
                  }`,
                  { projectId, cursor }
                );
                const items = response.node.items;
                const existingItem = items.nodes.find(
                  item => item.content && item.content.id === contentId
                );

                if (existingItem) {
                  return existingItem.id;
                }
                if (!items.pageInfo.hasNextPage) {
                  return null;
                }
                cursor = items.pageInfo.endCursor;
              }
            }

            const prs = await github.rest.pulls.list({ owner, repo, base: 'main', head: `${owner}:${branch}`, state: 'open' });
            let pr;
            if (prs.data.length) {
              pr = prs.data[0];
            } else {
              const typeMap = {feature:'feat', fix:'fix', bug:'fix', refactor:'refactor', chore:'chore', test:'test'};
              const title = `${typeMap[type]}: ${slug.replace(/-/g,' ')}`;
              const createPayload = { owner, repo, head: branch, base: 'main', title };
              if (issue) {
                createPayload.body = `Closes #${issue}`;
              }
              pr = (await github.rest.pulls.create(createPayload)).data;
            }

            // Project configuration
            function requiredEnv(name) {
              const value = (process.env[name] || '').trim();
              if (!value) {
                throw new Error(`Missing required workflow environment variable: ${name}`);
              }
              return value;
            }
            const projectId = requiredEnv('PROJECT_V2_ID');
            const fieldStatus = requiredEnv('PROJECT_FIELD_STATUS_ID');
            const optionStatusReview = requiredEnv('PROJECT_STATUS_OPTION_REVIEW_ID');
            const fieldWorkType = requiredEnv('PROJECT_FIELD_WORK_TYPE_ID');
            const workTypeOptions = {
              bug: requiredEnv('PROJECT_WORK_TYPE_OPTION_BUG_ID'),
              fix: requiredEnv('PROJECT_WORK_TYPE_OPTION_BUG_ID'),
              feature: requiredEnv('PROJECT_WORK_TYPE_OPTION_FEATURE_ID'),
              refactor: requiredEnv('PROJECT_WORK_TYPE_OPTION_REFACTOR_ID'),
              chore: requiredEnv('PROJECT_WORK_TYPE_OPTION_CHORE_ID'),
              test: requiredEnv('PROJECT_WORK_TYPE_OPTION_CHORE_ID'),
            };
            const fieldShipped = requiredEnv('PROJECT_FIELD_SHIPPED_ID');
            const optionShippedNo = requiredEnv('PROJECT_SHIPPED_OPTION_NO_ID');

            // Add PR to project (idempotent)
            const contentId = pr.node_id;
            let itemId;
            try {
              const addResp = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item { id }
                  }
                }`,
                { projectId, contentId }
              );
              itemId = addResp.addProjectV2ItemById.item.id;
            } catch (err) {
              if (!isAlreadyInProjectError(err)) {
                throw err;
              }
              core.info(`PR already exists in the project: ${err.message}`);
              itemId = await findProjectItemId(projectId, contentId);
              if (!itemId) {
                throw new Error('PR is already in the project but its item ID could not be found.');
              }
            }

            // Update fields
            const updates = [];
            updates.push({ fieldId: fieldStatus, value: { singleSelectOptionId: optionStatusReview } });
            if (workTypeOptions[type]) {
              updates.push({ fieldId: fieldWorkType, value: { singleSelectOptionId: workTypeOptions[type] } });
            }
            updates.push({ fieldId: fieldShipped, value: { singleSelectOptionId: optionShippedNo } });

            for (const u of updates) {
              await github.graphql(
                `mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $value:ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:$value}) { clientMutationId }
                }`,
                { projectId, itemId, fieldId: u.fieldId, value: u.value }
              );
            }

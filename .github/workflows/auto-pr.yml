name: auto-pr
on:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'bug/**'
      - 'refactor/**'
      - 'chore/**'
permissions:
  contents: read
  pull-requests: write
jobs:
  ensure-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR exists and add to project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/','');
            const match = branch.match(/^(feat|feature|bug|refactor|chore)\/(?:(\d+)-)?(.+)$/);
            if (!match) {
              core.warning(`Branch ${branch} does not match expected pattern`);
              return;
            }
            const [, rawType, issue, slug] = match;
            const type = rawType === 'feat' ? 'feature' : rawType;

            function isAlreadyInProjectError(err) {
              const message = err instanceof Error ? err.message : String(err);
              return message.includes('already exists in this project');
            }

            async function findProjectItemId(projectId, contentId) {
              let cursor = null;

              while (true) {
                const response = await github.graphql(
                  `query($projectId: ID!, $cursor: String) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        items(first: 100, after: $cursor) {
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                          nodes {
                            id
                            content {
                              __typename
                              ... on PullRequest {
                                id
                              }
                            }
                          }
                        }
                      }
                    }
                  }`,
                  { projectId, cursor }
                );
                const items = response.node.items;
                const existingItem = items.nodes.find(
                  item => item.content && item.content.id === contentId
                );

                if (existingItem) {
                  return existingItem.id;
                }
                if (!items.pageInfo.hasNextPage) {
                  return null;
                }
                cursor = items.pageInfo.endCursor;
              }
            }

            const prs = await github.rest.pulls.list({ owner, repo, base: 'main', head: `${owner}:${branch}`, state: 'open' });
            let pr;
            if (prs.data.length) {
              pr = prs.data[0];
            } else {
              const typeMap = {feature:'feat', bug:'fix', refactor:'refactor', chore:'chore'};
              const title = `${typeMap[type]}: ${slug.replace(/-/g,' ')}`;
              const createPayload = { owner, repo, head: branch, base: 'main', title };
              if (issue) {
                createPayload.body = `Closes #${issue}`;
              }
              pr = (await github.rest.pulls.create(createPayload)).data;
            }

            // Project configuration
            const projectId = 'PVT_kwDOB2OsP84BRN75';
            const fieldStatus = 'PVTSSF_lADOB2OsP84BRN75zg_HBVU';
            const optionStatusReview = '883cdec6';
            const fieldWorkType = 'PVTSSF_lADOB2OsP84BRN75zg_HEFM';
            const workTypeOptions = { bug: '29b7e082', feature: '3e6662c5', refactor: 'a60aa747', chore: '748f009e' };
            const fieldShipped = 'PVTSSF_lADOB2OsP84BRN75zg_HET4';
            const optionShippedNo = 'ef0a02b7';

            // Add PR to project (idempotent)
            const contentId = pr.node_id;
            let itemId;
            try {
              const addResp = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item { id }
                  }
                }`,
                { projectId, contentId }
              );
              itemId = addResp.addProjectV2ItemById.item.id;
            } catch (err) {
              if (!isAlreadyInProjectError(err)) {
                throw err;
              }
              core.info(`PR already exists in the project: ${err.message}`);
              itemId = await findProjectItemId(projectId, contentId);
              if (!itemId) {
                throw new Error('PR is already in the project but its item ID could not be found.');
              }
            }

            // Update fields
            const updates = [];
            updates.push({ fieldId: fieldStatus, value: { singleSelectOptionId: optionStatusReview } });
            if (workTypeOptions[type]) {
              updates.push({ fieldId: fieldWorkType, value: { singleSelectOptionId: workTypeOptions[type] } });
            }
            updates.push({ fieldId: fieldShipped, value: { singleSelectOptionId: optionShippedNo } });

            for (const u of updates) {
              await github.graphql(
                `mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $value:ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:$value}) { clientMutationId }
                }`,
                { projectId, itemId, fieldId: u.fieldId, value: u.value }
              );
            }

name: issue-intake

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  handle-intake:
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.pull_request == null
    steps:
      - name: Ask clarifying questions and create actionable ticket
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const questionMarker = "<!-- intake-questions -->";
            const ticketMarkerPrefix = "<!-- intake-ticket-link:";

            function labelName(label) {
              if (typeof label === "string") return label;
              return label?.name || "";
            }

            const labels = (issue.labels || []).map(labelName);
            const hasIntakeLabel = labels.includes("intake");

            async function listComments() {
              return await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
            }

            async function addLabel(label) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: [label],
                });
              } catch (err) {
                core.info(`Could not add label ${label}: ${err.message}`);
              }
            }

            async function removeLabel(label) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (err) {
                core.info(`Could not remove label ${label}: ${err.message}`);
              }
            }

            if (context.eventName === "issues") {
              if (!hasIntakeLabel) {
                core.info("Skip: issue is not labeled intake");
                return;
              }

              const comments = await listComments();
              const alreadyAsked = comments.some(c => c.body && c.body.includes(questionMarker));
              if (alreadyAsked) {
                core.info("Skip: intake questions already posted");
                return;
              }

              const body = [
                questionMarker,
                "Bedankt voor de ruwe intake. Om hiervan een uitvoerbaar engineering-ticket te maken, beantwoord deze vragen in deze thread:",
                "",
                "1. Wat is het gewenste gedrag?",
                "2. Wat is het huidige gedrag?",
                "3. Hoe reproduceren we dit probleem (stappen + omgeving)?",
                "4. Wat is de impact/urgentie?",
                "5. Wat is expliciet buiten scope?",
                "",
                "Als de context compleet is, plaats dan `/create-ticket` in een comment.",
                "De automation maakt dan een apart ticket aan met label `codex:ready`.",
              ].join("\n");

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });

              await addLabel("intake:questions-open");
              return;
            }

            if (context.eventName !== "issue_comment") {
              core.info(`Skip: unsupported event ${context.eventName}`);
              return;
            }

            const commentBody = (context.payload.comment?.body || "").trim();
            if (!commentBody.startsWith("/create-ticket")) {
              core.info("Skip: no create-ticket command");
              return;
            }

            if (!hasIntakeLabel) {
              core.info("Skip: create-ticket command only supported for intake issues");
              return;
            }

            const comments = await listComments();
            const existingTicketLink = comments.find(c => c.body && c.body.includes(ticketMarkerPrefix));
            if (existingTicketLink) {
              core.info("Skip: intake issue already converted to ticket");
              return;
            }

            const clarificationLines = comments
              .filter(c => c.user?.type !== "Bot")
              .map(c => (c.body || "").trim())
              .filter(text => text.length > 0)
              .filter(text => !text.startsWith("/"))
              .filter(text => !text.includes(questionMarker));

            const ticketTitle = issue.title.replace(/^\s*intake\s*:\s*/i, "").trim() || `Ticket from intake #${issueNumber}`;
            const sourceBody = (issue.body || "").trim();

            const ticketBody = [
              `Derived from intake #${issueNumber}`,
              "",
              "## Raw intake",
              sourceBody || "(empty)",
              "",
              "## Clarifications",
              clarificationLines.length > 0
                ? clarificationLines.map(line => `- ${line.replace(/\n/g, " ")}`).join("\n")
                : "- (none provided)",
              "",
              "## Delivery checklist",
              "- [ ] Problem statement and scope confirmed",
              "- [ ] Implementation approach agreed",
              "- [ ] Tests added or updated",
              "- [ ] CI is green",
            ].join("\n");

            const created = await github.rest.issues.create({
              owner,
              repo,
              title: ticketTitle,
              body: ticketBody,
              labels: ["codex:ready", "from:intake"],
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `${ticketMarkerPrefix}${created.data.number} --> Ticket aangemaakt: #${created.data.number}`,
            });

            await addLabel("intake:converted");
            await removeLabel("intake:questions-open");

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              state: "closed",
              state_reason: "completed",
            });

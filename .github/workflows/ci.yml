name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare CI env file
        run: cp .env.example .env.dev

      - name: Build and run format check
        run: docker compose -f docker-compose.dev.yml run --rm api black --check .

      - name: Run lint checks
        run: docker compose -f docker-compose.dev.yml run --rm api ruff check .

      - name: Run type checks
        run: docker compose -f docker-compose.dev.yml run --rm api uv tool run ty check

      - name: Run security lint
        run: docker compose -f docker-compose.dev.yml run --rm api ruff check . --select S

      - name: Run Bandit
        run: docker compose -f docker-compose.dev.yml run --rm api uv tool run bandit -r src

      - name: Run pip-audit
        run: docker compose -f docker-compose.dev.yml run --rm api uv tool run pip-audit

      - name: Validate live Azure config for CI
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          ADVANCED_AZURE_OPENAI_API_VERSION: ${{ secrets.ADVANCED_AZURE_OPENAI_API_VERSION }}
          ADVANCED_AZURE_OPENAI_MODEL: ${{ secrets.ADVANCED_AZURE_OPENAI_MODEL }}
        run: |
          issues=()
          required_vars=(
            AZURE_OPENAI_ENDPOINT
            AZURE_OPENAI_KEY
            ADVANCED_AZURE_OPENAI_API_VERSION
            ADVANCED_AZURE_OPENAI_MODEL
          )

          for var_name in "${required_vars[@]}"; do
            value="${!var_name:-}"
            if [[ -z "${value// }" ]]; then
              issues+=("${var_name} is missing or empty.")
            fi
          done

          endpoint_lower="$(printf '%s' "${AZURE_OPENAI_ENDPOINT:-}" | tr '[:upper:]' '[:lower:]')"
          key_lower="$(printf '%s' "${AZURE_OPENAI_KEY:-}" | tr '[:upper:]' '[:lower:]')"
          model_lower="$(printf '%s' "${ADVANCED_AZURE_OPENAI_MODEL:-}" | tr '[:upper:]' '[:lower:]')"

          if [[ -n "${endpoint_lower}" ]] && [[ "${endpoint_lower}" == *"your-resource.openai.azure.com"* || "${endpoint_lower}" == *"replace-me"* ]]; then
            issues+=("AZURE_OPENAI_ENDPOINT looks like a placeholder value.")
          fi
          if [[ -n "${key_lower}" ]] && [[ "${key_lower}" == "replace-me" || "${key_lower}" == "your-key" || "${key_lower}" == *"replace-me"* ]]; then
            issues+=("AZURE_OPENAI_KEY looks like a placeholder value.")
          fi
          if [[ -n "${model_lower}" ]] && [[ "${model_lower}" == "replace-me" || "${model_lower}" == "your-model" || "${model_lower}" == *"replace-me"* ]]; then
            issues+=("ADVANCED_AZURE_OPENAI_MODEL looks like a placeholder value.")
          fi

          if (( ${#issues[@]} > 0 )); then
            echo "CI cannot run mandatory live LLM smoke test due to invalid Azure configuration:"
            for issue in "${issues[@]}"; do
              echo "- ${issue}"
            done
            exit 1
          fi

      - name: Run test suite
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        env:
          RUN_LIVE_LLM_TESTS: "0"
        run: |
          docker compose -f docker-compose.dev.yml run --rm \
            -e RUN_LIVE_LLM_TESTS \
            api pytest

      - name: Run live-enabled test suite
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          RUN_LIVE_LLM_TESTS: "1"
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          ADVANCED_AZURE_OPENAI_API_VERSION: ${{ secrets.ADVANCED_AZURE_OPENAI_API_VERSION }}
          ADVANCED_AZURE_OPENAI_MODEL: ${{ secrets.ADVANCED_AZURE_OPENAI_MODEL }}
        run: |
          docker compose -f docker-compose.dev.yml run --rm \
            -e RUN_LIVE_LLM_TESTS \
            -e AZURE_OPENAI_ENDPOINT \
            -e AZURE_OPENAI_KEY \
            -e ADVANCED_AZURE_OPENAI_API_VERSION \
            -e ADVANCED_AZURE_OPENAI_MODEL \
            api pytest

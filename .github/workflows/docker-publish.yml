name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or sha)"
        required: false
        default: "main"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build ref
        id: build_ref
        env:
          DISPATCH_REF: ${{ github.event.inputs.ref }}
        run: |
          build_ref="${GITHUB_REF}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${DISPATCH_REF}" ]]; then
            build_ref="${DISPATCH_REF}"
          fi

          ref_name="${build_ref}"
          ref_name="${ref_name#refs/heads/}"
          ref_name="${ref_name#refs/tags/}"
          ref_name_sanitized="$(printf '%s' "${ref_name}" | tr '[:upper:]' '[:lower:]' | tr '/ ' '--')"

          echo "value=${build_ref}" >> "$GITHUB_OUTPUT"
          echo "name=${ref_name}" >> "$GITHUB_OUTPUT"
          echo "sanitized=${ref_name_sanitized}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build_ref.outputs.value }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          image="${owner}/${repo_name}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.build_ref.outputs.sanitized }}
            type=raw,value=latest,enable=${{ steps.build_ref.outputs.value == format('refs/heads/{0}', github.event.repository.default_branch) || steps.build_ref.outputs.value == github.event.repository.default_branch }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache,mode=max
